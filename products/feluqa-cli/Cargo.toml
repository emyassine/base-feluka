[package]
name = "feluqa-cli"
version.workspace = true
workspace = "../.."
build = "build.rs"
description = "Command line product for the Feluqa application platform."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa = { version = "0.2.0", registry = "feluqa", path = "../../crates/platform/feluqa", default-features = false, features = ["console", "definitions"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
toml = "0.8"

[build-dependencies]
feluqa = { version = "0.2.0", registry = "feluqa", path = "../../crates/platform/feluqa", default-features = false, features = ["console-build"] }

[[bin]]
name = "feluqa"
path = "src/main.rs"
