[package]
name = "feluqa-cli"
version = "0.1.0"
workspace = "../../_crates"
description = "Command line product for the Feluqa application platform."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa = { version = "0.2.0", registry = "feluqa", path = "../../_crates/feluqa", default-features = false, features = ["console"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[build-dependencies]
feluqa = { version = "0.2.0", registry = "feluqa", path = "../../_crates/feluqa", default-features = false, features = ["console"] }

[[bin]]
name = "feluqa"
path = "src/main.rs"

[[bin]]
name = "nadim"
path = "src/bin/nadim.rs"

[[bin]]
name = "feluqa-dev"
path = "src/bin/feluqa-dev.rs"
