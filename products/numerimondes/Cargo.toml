[package]
name = "numerimondes"
version.workspace = true
workspace = "../.."
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sea-orm.workspace = true
subtle.workspace = true
tokio.workspace = true
tower-http.workspace = true
feluqa = { version = "0.2.0", path = "../../crates/platform/feluqa" }

[build-dependencies]
feluqa = { path = "../../crates/platform/feluqa", features = ["view-compiler"] }
feluqa-build = { path = "../../tools/feluqa-build" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
