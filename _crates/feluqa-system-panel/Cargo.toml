description = "Feluqa's built-in system panel provider and resources."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa-auth = { version = "0.1.0", registry = "feluqa", path = "../feluqa-auth" }
