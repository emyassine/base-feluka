[package]
name = "feluqa"
version = "0.2.0"
description = "Proprietary public facade for the Feluqa application framework."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[features]
default = ["web"]
web = ["console", "view", "auth", "ui", "panel", "notifications", "live", "module", "database", "core", "system-panel", "imagery", "dep:axum", "dep:serde"]
console = ["dep:feluqa-console"]
view = ["dep:feluqa-view"]
view-compiler = ["view", "feluqa-view/compiler"]
auth = ["dep:feluqa-auth"]
ui = ["dep:feluqa-ui"]
panel = ["auth", "ui", "dep:feluqa-panel"]
notifications = ["dep:feluqa-notifications"]
live = ["auth", "dep:feluqa-live"]
module = ["dep:feluqa-module"]
database = ["dep:feluqa-database"]
core = ["database", "dep:feluqa-core"]
system-panel = ["panel", "dep:feluqa-system-panel"]
imagery = ["dep:feluqa-imagery"]
spa = ["ui", "auth", "live"]
mobile = ["ui", "auth"]
desktop = ["ui", "auth"]
game = ["ui"]
realtime = []

[dependencies]
feluqa-auth = { version = "0.1.0", registry = "feluqa", path = "../feluqa-auth", optional = true}
feluqa-ui = { version = "0.1.0", registry = "feluqa", path = "../feluqa-ui", optional = true}
feluqa-panel = { version = "0.1.0", registry = "feluqa", path = "../feluqa-panel", optional = true}
feluqa-notifications = { version = "0.1.0", registry = "feluqa", path = "../feluqa-notifications", optional = true}
feluqa-live = { version = "0.1.0", registry = "feluqa", path = "../feluqa-live", optional = true}
feluqa-module = { version = "0.1.0", registry = "feluqa", path = "../feluqa-module", optional = true}
feluqa-database = { version = "0.1.0", registry = "feluqa", path = "../feluqa-database", optional = true}
feluqa-core = { version = "0.1.0", registry = "feluqa", path = "../feluqa-core", optional = true}
feluqa-system-panel = { version = "0.1.0", registry = "feluqa", path = "../feluqa-system-panel", optional = true}
feluqa-imagery = { version = "0.1.0", registry = "feluqa", path = "../feluqa-imagery", optional = true}
feluqa-console = { version = "0.1.1", registry = "feluqa", path = "../feluqa-console", optional = true}
feluqa-view = { version = "0.2.0", registry = "feluqa", path = "../feluqa-view", optional = true}
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
subtle.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
