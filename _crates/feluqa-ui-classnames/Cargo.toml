[package]
name = "feluqa-ui-classnames"
version = "0.1.21"
edition = "2024"
license = "MIT"
description = "Internalized Tailwind class merge and variant macros."

[dependencies]
nom = "7"
feluqa_ui_classnames_macros = { workspace = true, optional = true , path = "../feluqa-ui-classnames-macros"}

[features]
