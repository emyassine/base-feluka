[package]
name = "feluqa-ui-components"
version = "0.1.0"
description = "Feluqa-owned Feluqa UI component API adapted from the Rust UI registry."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version = "1.88"
publish = ["feluqa"]

[features]
card = ["dep:feluqa-ui-card", "dep:feluqa-ui-card-elements"]
full-catalog = ["card"]

[dependencies]
feluqa_ui_runtime.workspace = true
feluqa_ui_navigation.workspace = true
feluqa_ui_component_macros.workspace = true
feluqa_ui_autoform.workspace = true
feluqa_ui_classnames.workspace = true
serde.workspace = true
serde_json.workspace = true
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3", features = ["serde", "wasm-bindgen"] }
validator = { version = "0.20", features = ["derive"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
heck.workspace = true
feluqa-ui-card = { path = "../feluqa-ui-card", optional = true }
feluqa-ui-card-elements = { path = "../feluqa-ui-card-elements", optional = true }

[lib]
name = "feluqa_ui_components"
path = "src/lib.rs"
