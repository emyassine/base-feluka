[workspace]
resolver = "3"
members = [
    "feluqa",
    "feluqa-console",
    "feluqa-view",
    "../products/feluqa-cli",
    "../products/numerimondes",
]

[workspace.package]
edition = "2024"
license-file = "../LICENSE"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
