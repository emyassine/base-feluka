[workspace]
resolver = "3"
exclude = ["archive/prototypes/legacy-codebase"]
members = [
    "crates/feluqa",
    "crates/feluqa-console",
    "crates/feluqa-view",
    "apps/numerimondes",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
