[package]
name = "feluqa-database"
version = "0.1.0"
description = "Named database connections and dialect migrations for Feluqa applications."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa-model-derive = { path = "../../macros/feluqa-model-derive", version = "0.1.0" }
sea-orm = { version = "=1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "with-json"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
