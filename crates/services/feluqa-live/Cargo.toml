[package]
name = "feluqa-live"
version = "0.1.0"
description = "Signed, authorized, replay-protected HTTP actions for Feluqa Live."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa-auth = { version = "0.1.0", registry = "feluqa", path = "../feluqa-auth" }
hmac = "0.12"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
zeroize = "1"
