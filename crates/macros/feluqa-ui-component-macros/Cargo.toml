[package]
name = "feluqa-ui-component-macros"
version = "0.3.22"
edition = "2024"
license = "MIT"
description = "Internalized Rust UI Feluqa UI component macros."

[dependencies]
feluqa_ui_runtime = { package = "feluqa-ui-runtime", path = "../../ui/feluqa-ui-runtime", version = "0.8.15", features = ["nightly", "ssr"] }
feluqa_ui_classnames = { package = "feluqa-ui-classnames", path = "../../ui/feluqa-ui-classnames", version = "0.1.21", features = ["variant"] }
paste = "1"

[lib]
name = "feluqa_ui_component_macros"
path = "src/lib.rs"
