[package]
name = "feluqa-ui"
version = "0.1.0"
description = "Versioned, validated Feluqa UI schemas for server-driven interfaces."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
feluqa-ui-components = { version = "0.1.0", registry = "feluqa", path = "../feluqa-ui-components", optional = true }

[features]
default = []
component-runtime = ["dep:feluqa-ui-components"]
panel-shell = ["component-runtime", "feluqa-ui-components/panel-shell"]
components = ["component-runtime", "feluqa-ui-components/full-catalog"]
components-card = ["component-runtime", "feluqa-ui-components/card"]
