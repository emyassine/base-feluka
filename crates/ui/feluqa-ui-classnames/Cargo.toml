[package]
name = "feluqa-ui-classnames"
version = "0.1.21"
edition = "2024"
license = "MIT"
description = "Internalized Tailwind class merge and variant macros."

[dependencies]
nom = "7"
feluqa_ui_classnames_macros = { package = "feluqa-ui-classnames-macros", path = "../../macros/feluqa-ui-classnames-macros", version = "0.1.9", optional = true }

[features]
variant = ["dep:feluqa_ui_classnames_macros"]
debug = []

[lib]
name = "feluqa_ui_classnames"
path = "src/lib.rs"
