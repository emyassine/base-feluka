[package]
name = "feluqa-ui-card"
version = "0.1.0"
description = "Feluqa card surface component."
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa_ui_classnames = { package = "feluqa-ui-classnames", path = "../feluqa-ui-classnames", version = "0.1.21", features = ["variant"] }
feluqa_ui_component_macros = { package = "feluqa-ui-component-macros", path = "../../macros/feluqa-ui-component-macros", version = "0.3.22" }
feluqa_ui_runtime = { package = "feluqa-ui-runtime", path = "../feluqa-ui-runtime", version = "0.8.15", features = ["nightly", "ssr"] }

[lib]
name = "feluqa_ui_card"
path = "src/lib.rs"
