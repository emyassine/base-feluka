[package]
name = "feluqa-console"
version = "0.1.1"
description = "Proprietary console command contracts for the Feluqa application framework."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[features]
default = ["std"]
std = ["dep:crossterm", "dep:signal-hook"]
build = ["std", "dep:syn"]
platform = ["std", "dep:feluqa-definitions"]

[dependencies]
inventory = "0.3"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"], optional = true }
signal-hook = { version = "0.3", optional = true }
feluqa-console-macros = { version = "0.1.0", registry = "feluqa", path = "../../macros/feluqa-console-macros" }
syn = { version = "2", features = ["full"], optional = true }
feluqa-definitions = { version = "0.1.0", registry = "feluqa", path = "../../core/feluqa-definitions", optional = true }
