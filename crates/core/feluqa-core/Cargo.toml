[package]
name = "feluqa-core"
version = "0.1.0"
description = "Persistent identity, access-control, session and audit schema for Feluqa Core."
authors = ["El Moumen Yassine <yassine@numerimondes.com>"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = ["feluqa"]

[dependencies]
feluqa-database = { version = "0.1.0", registry = "feluqa", path = "../../services/feluqa-database" }
feluqa-auth = { version = "0.1.0", registry = "feluqa", path = "../../services/feluqa-auth" }
sea-orm.workspace = true
argon2.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
